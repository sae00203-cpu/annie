<!DOCTYPE html><html lang="ko"><head><script>
/* ===== 체험용 예시 데이터: 3년 다닌 가상의 학생 "한서윤 (Grace)" =====
 * 실제 학생 정보가 아니에요. 페이지를 여는 날짜를 기준으로 3년 치 기록을 만들어요.

 */
(function () {
  var rnd = (function (seed) { return function () { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; })(20231106);
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var addD = function (d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; };
  var addM = function (d, n) { var x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  var now = new Date(); now.setHours(0, 0, 0, 0);
  var start = addM(now, -36); while (start.getDay() !== 1) start = addD(start, -1);   // 3년 전 그 주 월요일

  var docs = {};
  var put = function (c, id, o) { docs[c + '|' + id] = o; };

  // 반: 앤도버 레벨 체계대로 G3(파닉스 9개월) → A1a-1 … A2b-2 (3개월씩) → A3a-1 (지금 반)

    ['A1a-1', 3, ['Wonderskills Basic 1', 'Voca Point 1']],

    ['A1b-2', 3, ['All New Very Easy True Stories', 'Grammar Start 2']],

    ['A2a-2', 3, ['Wonder Skills Intermediate 2', 'Grammar Point 1']],
    ['A2b-1', 3, ['True Stories 1A', 'Grammar Point 2']],

    ['A3a-1', 0, ['Trophy 9 Our World 4A', 'My Next Grammar 1']],
  ];
  var TEACH = ['Kate T.', 'Ben T.', 'Lucy T.'];
  var C = [], at = new Date(start);
  LV.forEach(function (l, i) {

  // 정기평가 (6개월마다)

    var rd = addM(start, 6 * k - 1); rd.setDate(20); if (rd >= now) break;

  /* ===== 더 많은 예시: 지금 다니는 반 8개 · 학생 약 50명 · 최근 4개월 기록 (모두 가상) ===== */
  (function () {

      ['주원', 'Juwon'], ['아린', 'Arin'], ['건우', 'Gunwoo'], ['서우', 'Seowoo'], ['우진', 'Woojin'], ['채원', 'Chaewon'], ['선우', 'Sunwoo'], ['지유', 'Jiyu'], ['연우', 'Yeonwoo'], ['다은', 'Daeun'],

function mkCands(c,ds){

  var out=[],dw=c.dow||[];
  for(var i=-60;i<=30;i++){var d=dAdd(ds,i);if(d===ds)continue;if(dw.length&&dw.indexOf(dDow(d))<0)continue;if(used[d])continue;var o=offInfo(d,c);if(o)out.push({d:d,name:o.name})}

/* ---------- 레벨 · 반 이력 ---------- */
var PM_ORDER=['PMB','PMC','PME','PHE'];
var TRACK_RANK={G:0,A:1,F:2,P:3,M:4};
function lvParse(txt){
  var n=String(txt||'').toUpperCase().replace(/\s+/g,''),m;
  if((m=n.match(/^G(\d+)/)))return {tr:'G',k:[+m[1]],code:'G'+m[1]};
  if((m=n.match(/^A(\d+)([A-Z])(?:-(\d+))?/)))return {tr:'A',k:[+m[1],m[2].charCodeAt(0),+(m[3]||0)],code:'A'+m[1]+m[2].toLowerCase()+(m[3]?'-'+m[3]:'')};
  if((m=n.match(/^F(\d+)([A-Z])/)))return {tr:'F',k:[+m[1],m[2].charCodeAt(0)],code:'F'+m[1]+m[2].toLowerCase()};
  if((m=n.match(/^(PMB|PMC|PME|PHE)/)))return {tr:'P',k:[PM_ORDER.indexOf(m[1])],code:m[1]};
  if((m=n.match(/^M(\d+)([A-Z])/)))return {tr:'M',k:[+m[1],m[2].charCodeAt(0)],code:'M'+m[1]+m[2].toLowerCase()};
  return null;
}
function lvOf(cid){var c=S.classes.find(function(x){return x.id===cid});if(!c)return null;return lvParse(c.lv)||lvParse(c.name)}
function lvCode(cid){var l=lvOf(cid);return l?l.code:''}
function lvCmp(a,b){for(var i=0;i<Math.max(a.k.length,b.k.length);i++){var x=a.k[i]||0,y=b.k[i]||0;if(x!==y)return x<y?-1:1}return 0}
function moveKind(from,to){
  var a=lvOf(from),b=lvOf(to);if(!a||!b)return 'move';
  if(a.tr===b.tr){var r=lvCmp(a,b);return r<0?'up':r>0?'down':'move'}
  if(a.tr==='G'&&b.tr==='A')return 'up';
  return 'track';
}
var KIND_L={up:'레벨업',down:'레벨 조정',move:'반 이동',track:'과정 변경',start:'입학'};
function clsSortKey(c){var l=lvParse(c.lv)||lvParse(c.name);return l?[TRACK_RANK[l.tr]].concat(l.k):[9]}
function clsByLevel(){return S.classes.slice().sort(function(a,b){var x=clsSortKey(a),y=clsSortKey(b);for(var i=0;i<Math.max(x.length,y.length);i++){var p=x[i]||0,q=y[i]||0;if(p!==q)return p-q}return a.name.localeCompare(b.name,'ko')})}
function hSort(a,b){return (a.d||'')<(b.d||'')?-1:(a.d||'')>(b.d||'')?1:0}
/* 학생이 어느 반에 언제부터 언제까지 있었는지 */
function srPeriods(s){
  var mv=(s.hist||[]).filter(function(x){return x.t==='class'&&x.to}).slice().sort(hSort);
  var P=[],start=s.enrolledAt||'',cur=mv.length?(mv[0].from||''):s.classId,sh=null;
  mv.forEach(function(x){
    var end=addDays(x.d,-1);
    if(cur&&(!start||start<=end))P.push({cid:cur,from:start,to:end,sh:sh,eh:x});
    start=x.d;cur=x.to;sh=x;
  });
  P.push({cid:s.classId,from:start,to:'',sh:sh,eh:null});
  return P;
}
function clipRange(p,a,b){var aa=p.from&&p.from>a?p.from:a,bb=p.to&&p.to<b?p.to:b;return aa<=bb?[aa,bb]:null}
function periodBooks(cid,a,b){
  var lim=b&&b<today()?b:today(),ds=[];
  S.plans.forEach(function(pl,k){if(pl&&pl.classId===cid&&pl.date>=(a||'')&&pl.date<=lim)ds.push(pl)});
  ds.sort(function(x,y){return x.date<y.date?-1:1});
  var seen=[];ds.forEach(function(pl){(pl.blocks||[]).forEach(function(b){var n=String(b.book||'').trim();if(n&&!NOT_BOOK.test(n)&&seen.indexOf(n)<0)seen.push(n)})});
  return seen;
}
/* 수업계획 교재 칸에 섞여 있는 행사·시험 이름은 교재 목록에서 빼요 */
var NOT_BOOK=/(test|review|interview|market\s*day|^pbl$|^[ㄱ-ㅎ]\s|레벨\s*테스트|휴강|보강|행사)/i;
function periodStats(s,cid,a,b){var D=stuData(Object.assign({},s,{classId:cid}),a||'',b||today());if(!D)return null;return Object.assign({n:D.n},srPct({n:D.n,present:D.present,late:D.late,tests:D.tests,hwn:D.hwn,hwd:D.hwd}))}
/* 반 이동 기록 한 줄 만들기 (그 반에서 지낸 기간 · 교재 · 성적을 함께 남겨요) */
function moveEntry(s,from,to,d){
  d=d||today();
  var cur=srPeriods(s).pop(),a=cur.from||'',end=addDays(d,-1),snap=null;
  if(from){try{var st=periodStats(s,from,a,end);snap={from:a,to:end,books:periodBooks(from,a,end),att:st&&st.att,hw:st&&st.hw,word:st&&st.word}}catch(e){console.error(e)}}
  return {id:uid('h'),d:d,t:'class',from:from,to:to,v:clsName(from)+' → '+clsName(to),kind:from?moveKind(from,to):'start',fromName:clsName(from),toName:clsName(to),fromLv:lvCode(from),toLv:lvCode(to),snap:snap};
}
function moveStu(s,to,d){

/* ---------- coaching ---------- */
var DOWK=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
var lines=function(t){return String(t||'').split('\n').map(function(x){return x.trim()}).filter(Boolean)};
function hwClean(x){return x.replace(/\s*\[[^\]]+\]\s+(on the )/i,' $1').replace(/\s*[□☐ㅁ]\s*(\(체크하세요\))?\s*$/,'').replace(/\s*\(체크하세요\)\s*$/,'').replace(/\s+/g,' ').trim()}
function hwUnits(t,legacy){
  var L=lines(t),num=L.some(function(x){return /^\d+\s*[.)]/.test(x)}),items=[],map=[];
  L.forEach(function(x){
    var cont=items.length&&(num?!/^\d+\s*[.)]/.test(x):/^[\/]/.test(x));
    if(cont)items[items.length-1]+=' '+x;else items.push(x);
    map.push(items.length-1);
  });
  if(legacy)return L.map(function(x,k){return {t:x,g:map[k]}});
  return items.map(function(x,k){return {t:hwClean(x),g:k}});
}
/* ---------- 스피킹 인증제 ---------- */
var SPC_LEVELS0=['Red','Orange','Yellow','Green','Lime','Mint','Sky Blue','Blue','Indigo','Purple','Black'];
var SPC_COLOR={red:'#E53935',orange:'#FB8C00',yellow:'#FDD835',green:'#43A047',lime:'#9CCC65',mint:'#4DD0C4',sky:'#4FC3F7',blue:'#1E88E5',indigo:'#3949AB',purple:'#8E24AA',black:'#212121'};
function spcCfg(){var o=S.cfg.spcCert||{};return {max:Number(o.max)||72,every:Number(o.every)||6,levels:Array.isArray(o.levels)&&o.levels.length?o.levels:SPC_LEVELS0.slice()}}
/* 레벨 이름 앞에 그 색 점 */
function spcDot(lv){var k=String(lv||'').trim().toLowerCase().split(/\s+/)[0],c=SPC_COLOR[k];return c?'<i class="spcdot" style="background:'+c+'" aria-hidden="true"></i>':''}
function spcLvHTML(lv){return lv?'<span class="spclv">'+spcDot(lv)+esc(lv)+'</span>':''}
/* 'Day 25,26,27' · 'Day 37.38.39' · 'Day 25-27' → [25,26,27] */
function spcDays(t){
  var out=[],s=String(t||''),m,re=/day\s*([\d\s,.~\-–]+)/ig;
  while((m=re.exec(s))){
    var part=m[1],rg=part.match(/(\d+)\s*[~\-–]\s*(\d+)/);
    if(rg){for(var i=+rg[1];i<=+rg[2]&&i-+rg[1]<40;i++)out.push(i)}
    else part.split(/[\s,.]+/).forEach(function(x){if(/^\d+$/.test(x))out.push(+x)});
  }
  return out.filter(function(x,i,a){return x>0&&a.indexOf(x)===i});
}
/* 수업계획의 스피킹 칸이나 반 설정에서 레벨을 찾아요 */
function spcLevel(c,pl){
  var L=spcCfg().levels,t=String(pl&&pl.spc||'');
  for(var i=0;i<L.length;i++){if(!L[i])continue;var rx=new RegExp('(^|[^A-Za-z가-힣])'+String(L[i]).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s*')+'(?![A-Za-z가-힣])','i');if(rx.test(t))return L[i]}
  return (c&&c.spcLv)||'';
}
function spcCertDays(pl){var C=spcCfg();return spcDays(pl&&pl.spc).filter(function(d){return d%C.every===0&&d<=C.max})}

function coachGen(c,date,legacy,nospc){
  var pl=planFor(c,date);if(!pl)return [];
  var out=[];
  (pl.blocks||[]).forEach(function(b,bi){
    var lesson=lines(b.lesson).join(' ').replace(/\s+/g,' ');
    hwUnits(b.hw,legacy).forEach(function(u){
      var ln=u.t;
      if(/^\(.*\)$/.test(ln))return;
      var m=ln.replace(/^\d+\.\s*/,'').replace(/\s*[□☐]\s*$/,'');
      var lab;
      var mb=m.replace(/\s*\([^)]*\)\s*$/,'');
      if(/^(meta\s*book|메타\s*북)(\s*숙제)?$/i.test(mb))lab=(b.book+' '+lesson).trim()+' Metabook';
      else if(/^(meta\s*book|메타\s*북)\b/i.test(mb))lab=(b.book+' '+lesson).trim()+' Metabook '+mb.replace(/^(meta\s*book|메타\s*북)\s*/i,'');
      else if(/^student book$/i.test(m))lab=b.book+' '+lesson+' Student Book';
      else if(/^\[[^\]]+\]\s*on the /i.test(m))lab=b.book+' '+m.replace(/^\[([^\]]+)\].*/,'$1');
      else lab=b.book+' '+m;
      out.push({lab:lab,g:bi+'.'+u.g});
    });
  });
  if(!legacy&&!nospc&&pl.spc){
    var sp=lines(pl.spc).join(' ').replace(/\s+/g,' '),lv=spcLevel(c,pl);
    if(spcCertDays(pl).length)sp=sp.replace(/\s*(video|비디오|영상)\s*(찍기|촬영)\s*/ig,' ').trim();
    if(sp)out.push({lab:'SPC '+(lv&&sp.toLowerCase().indexOf(lv.toLowerCase())<0?lv+' ':'')+sp,g:'spc'});
    spcCertDays(pl).forEach(function(d){out.push({lab:'🎤 SPC 인증 영상'+(lv?' '+lv:'')+' Day '+d+' (가정에서 촬영 · 밴드 제출)',g:'spcv'+d})});
  }
  if(!legacy){
    S.vassign.forEach(function(a){
      if(a.classId!==c.id||a.date!==date||/_spc\d*$/.test(a.id))return;
      out.push({lab:'📹 Video 숙제 가정 제출: '+a.title,g:'vid_'+a.id});
    });
  }
  var on=(pl.notice||'').match(/\[([^\]]*온라인[^\]]*)\]/);
  if(on)out.push({lab:on[1].replace(/온라인\s*학습/,'Online 학습'),g:'on'});
  return out;
}
function coachItems(c,date){return coachGen(c,date,false).map(function(o){return o.lab})}
/* 예전 방식(줄마다 한 항목)으로 저장된 코칭 기록을 새 항목으로 옮긴다 */
var coachMig={};
function coachMigrate(){
  S.coach.forEach(function(r,mid){
    var key=mid+'|'+(r.savedAt||'');if(coachMig[key])return;coachMig[key]=1;
    var c=S.classes.find(function(x){return x.id===r.classId});if(!c||!r.items||!r.items.length)return;
    var lg=coachGen(c,r.date,true),nw=coachGen(c,r.date,false),js=function(a){return JSON.stringify(a.map(function(o){return o.lab}))};
    if(js(nw)===JSON.stringify(r.items))return;
    if(js(lg)!==JSON.stringify(r.items)){lg=coachGen(c,r.date,false,true);if(js(lg)!==JSON.stringify(r.items))return}
    var map=lg.map(function(o){return nw.findIndex(function(q){return q.g===o.g})});
    var mp=function(a){var o=[];(a||[]).forEach(function(k){var j=map[k];if(j>=0&&o.indexOf(j)<0)o.push(j)});return o.sort(function(a,b){return a-b})};
    var x={};Object.keys(r.x||{}).forEach(function(sid){x[sid]=mp(r.x[sid])});
    var n=Object.assign({},r,{items:nw.map(function(o){return o.lab}),x:x});
    S.coach.set(mid,n);write('coach/'+mid,n,'k'+mid);
  });
}

function coachMsg(c,rec,items,s){
  var d=parse(S.date),x=(rec&&rec.x&&rec.x[s.id])||[];
  var L=['📝 '+d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 코칭 브리핑','','📌 '+(s.ename||s.name),'[금일 완료된 다짐활동]'];
  items.forEach(function(t,i){if(x.indexOf(i)<0)L.push('✅ '+t)});
  L.push('','[금일 미완료된 다짐활동]');
  items.forEach(function(t,i){if(x.indexOf(i)>=0)L.push('📄 '+t)});
  var pl=planFor(c,S.date),extra=[];
  if(pl){
    var ol=lines(pl.notice).filter(function(l){return /온라인/.test(l)})[0];
    if(ol)extra.push('➕ '+ol.replace(/^\[[^\]]*\]\s*/,'').replace(/\s+/g,' '));
    var vt=lines(pl.voca).join(' ');
    var vm=vt.match(/\((\d{1,2})\/(\d{1,2})\s*실시\)/);
    var td=null,implicit=false;
    if(vm)td=new Date(d.getFullYear(),Number(vm[1])-1,Number(vm[2]),12);
    else if(vt&&(c.dow||[]).length){implicit=true;td=new Date(d.getTime());for(var q=0;q<8;q++){td.setDate(td.getDate()+1);if(c.dow.indexOf(td.getDay())>=0)break}}
    if(td){
      var diff=Math.round((td-d)/86400000);
      var when=implicit?'다음 수업일('+DOWK[td.getDay()]+')':(diff===0?'오늘':(diff>0&&diff<7?'이번 주 '+DOWK[td.getDay()]:(td.getMonth()+1)+'/'+td.getDate()+'('+DOWK[td.getDay()].slice(0,1)+')'));
      var range=vt.replace(/\([^)]*실시\)/,'').replace(/암기하기/,'').replace(/\s+/g,' ').trim();
      extra.push('➕ '+when+' '+range+' 단어 시험이 예정되어 있습니다. 아이들이 충분히 학습할 수 있도록 지도 부탁드립니다!');
    }
  }
  if(extra.length){L.push('');extra.forEach(function(e){L.push(e)})}
  return L.join('\n');
}

      }else{

  }).join('');
  h.innerHTML=head+'<div class="chips" style="align-items:center"><span class="chip ok"><b>'+items.length+'</b>오늘 숙제 항목</span><span class="chip">처음엔 모두 완료 · 못 한 것만 눌러요</span>'+(rec?'<span class="chip ok">기록됨 '+hhmm(rec.savedAt)+'</span>':'<button type="button" class="ghost sm" data-savecoach="1">이 반 코칭 기록 저장</button>')+'</div>'+coachTeacherHTML(c,rec)+rows;

var MON=/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{2})\s+Student\s*List/i;
var MONS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
var EN_DOW={mon:1,tue:2,wed:3,thu:4,fri:5,sat:6,sun:0};

function parseHeader(v){
  var t=String(v).replace(/\s+/g,' ').trim();
  var label=t.replace(/^\d+\.\s*/,'');
  var name=label.split(' ')[0];
  var dow=[];var mm=t.match(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*/gi)||[];
  mm.forEach(function(x){var d=EN_DOW[x.slice(0,3).toLowerCase()];if(d!=null&&dow.indexOf(d)<0)dow.push(d)});
  var tm=(t.match(/(\d{1,2}:\d{2})/)||[])[1]||'';
  var tc=t.match(/담임\s*[:：]\s*(.*)$/);
  var teacher=tc?tc[1].replace(/\s+/g,' ').trim().slice(0,30):'';
  return {name:name,dow:dow,time:tm,teacher:teacher,students:[]};
}
function parseSheet(ws){
  var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  var ncol=0;rows.forEach(function(r){ncol=Math.max(ncol,r.length)});
  var classes=[],cur={};
  rows.forEach(function(row){
    for(var c0=0;c0<ncol;c0+=8){
      var v=row[c0+1];
      if(typeof v==='string'&&/\d:\d\d|\d시|담임/.test(v)){cur[c0]=parseHeader(v);classes.push(cur[c0]);continue}
      var no=row[c0];
      if(cur[c0]&&typeof v==='string'&&v.trim()&&(typeof no==='number'||/^\d+(\.0)?$/.test(String(no).trim()))){
        cur[c0].students.push({name:v.trim().replace(/\s+/g,' '),ename:String(row[c0+2]||'').trim(),sg:String(row[c0+4]||'').replace(/\s+/g,' ').trim()});
      }
    }
  });
  var cnt={};classes.forEach(function(c){cnt[c.name]=(cnt[c.name]||0)+1});
  classes.forEach(function(c){
    c.key=c.name+'|'+c.dow.join('')+'|'+c.time;
    c.disp=cnt[c.name]>1?c.name+' ('+c.dow.map(function(d){return DOW[d]}).join('')+' '+c.time+')':c.name;
  });

}
function buildPlan(parsed,sheet){
  var plan={classes:[],studs:[],missing:[],counts:{add:0,move:0,upd:0,same:0},sheet:sheet};
  var used={},cmap={};
  parsed.forEach(function(p){
    var ex=S.classes.find(function(c){return c.key===p.key})||S.classes.find(function(c){return !c.key&&c.name===p.disp});
    var obj=Object.assign({},ex||{},{id:ex?ex.id:uid('c'),name:p.disp,teacher:p.teacher,dow:p.dow,time:p.time,key:p.key});
    var changed=!ex||ex.name!==obj.name||ex.teacher!==obj.teacher||ex.time!==obj.time||ex.key!==obj.key||JSON.stringify(ex.dow||[])!==JSON.stringify(obj.dow);
    plan.classes.push({obj:obj,isNew:!ex,changed:changed});
    cmap[p.key]=obj;
  });
  var order={};
  parsed.forEach(function(p){
    var co=cmap[p.key];
    p.students.forEach(function(f){
      var cand=S.students.filter(function(s){return !used[s.id]&&s.status!=='left'&&norm(s.name)===norm(f.name)&&(!f.ename||!s.ename||norm(s.ename)===norm(f.ename))});
      if(cand.length>1){var c2=cand.filter(function(s){return norm(s.sg)===norm(f.sg)});if(c2.length)cand=c2}
      if(cand.length>1){var c3=cand.filter(function(s){return norm(s.ename)===norm(f.ename)});if(c3.length)cand=c3}
      var ex=cand[0]||null;
      order[co.id]=(order[co.id]||0);
      var data=Object.assign({},ex||{},{id:ex?ex.id:uid('s'),name:f.name,ename:f.ename||(ex&&ex.ename)||'',sg:f.sg,classId:co.id,order:order[co.id]++,status:'active',src:'list',listMonth:plan.sheet});
      if(!ex){data.enrolledAt='';data.createdAt=new Date().toISOString()}
      var kind='same';
      if(!ex)kind='add';
      else if(ex.classId!==co.id)kind='move';
      else if((ex.sg||'')!==f.sg||(f.ename&&ex.ename!==f.ename))kind='upd';
      if(ex)used[ex.id]=1;
      plan.counts[kind==='add'?'add':kind==='move'?'move':kind==='upd'?'upd':'same']++;
      plan.studs.push({data:data,kind:kind,old:ex,toName:co.name});
    });
  });
  plan.missing=S.students.filter(function(s){return !used[s.id]&&s.status!=='left'});
  return plan;
}

async function impLoad(file){

S.lp=null;
var LP_MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function lpMonthOf(t){var m=String(t||'').match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i);return m?LP_MON[m[1].toLowerCase()]:0}
function lpTxt(v){
  if(v instanceof Date)return isNaN(v)?'':ymd(new Date(v.getTime()+12*36e5));
  return String(v==null?'':v).replace(/\r/g,'').split('\n').map(function(x){return x.replace(/[ \t]+/g,' ').trim()}).filter(Boolean).join('\n');

function lpDate(v,yr){
  if(v instanceof Date&&!isNaN(v))return ymd(new Date(v.getTime()+12*36e5));
  if(typeof v==='number'&&v>40000&&v<60000){var o=XLSX.SSF.parse_date_code(v);return o?o.y+'-'+pad(o.m)+'-'+pad(o.d):''}

  if((m=t.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=t.match(/^(\d{1,2})\/(\d{1,2})(\s*\(.*\))?$/))&&+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31)return yr+'-'+pad(+m[1])+'-'+pad(+m[2]);

function lpGrid(ws){

function lpParseSheet(ws,sn){
  var g=lpGrid(ws),yr=new Date().getFullYear(),i,r;
  var title='';for(i=0;i<Math.min(g.length,4);i++){var t0=lpTxt((g[i]||[])[0]);if(/Session\s*:/i.test(t0)){title=t0;break}}

  });

function lpParseBook(buf,fname){

/* 그날 수업계획에서 이 사이트 교재의 Day 번호 → 레슨 (Day 2 → Lesson 2, 레슨 수보다 크면 처음부터) */
function lessonFor(c,n,d){
  var cnt=siteLessonCount(n);if(!cnt)return 0;var pl=planFor(c,d);if(!pl)return 0;
  var k=String(n).replace(/[\s\-]/g,'').toLowerCase();
  var b=(pl.blocks||[]).find(function(x){return String(x.book||'').replace(/[\s\-]/g,'').toLowerCase().indexOf(k)>=0});
  var m=b&&String(b.lesson||'').match(/(?:day|lesson)\s*(\d+)/i);if(!m)return 0;
  return ((+m[1]-1)%cnt)+1;
}
function defItems(c,site){return lines((c&&c.onItems&&c.onItems[site])||siteCfgOf(site).items||'')}
function siteModeDef(n){return siteCfgOf(n).mode||(/^(trophy|a\s*-?\s*one)/i.test(n)?'book':'every')}
function siteMode(c,n){var m=c&&c.siteMode&&c.siteMode[n];return m||siteModeDef(n)}
function siteOn(c,n,d){
  if(siteMode(c,n)!=='book')return true;
  var pl=planFor(c,d),k=String(n).replace(/[\s\-]/g,'').toLowerCase();
  return !!pl&&(pl.blocks||[]).some(function(b){return String(b.book||'').replace(/[\s\-]/g,'').toLowerCase().indexOf(k)>=0});
}
function sitesOn(c,d){return (c.sites||[]).filter(function(n){return siteOn(c,n,d)})}
function onClone(c,d){
  var o=onGet(c,d);
  if(o)return {classId:o.classId,date:o.date,site:o.site,lesson:o.lesson,items:o.items.slice(),x:JSON.parse(JSON.stringify(o.x||{})),none:(o.none||[]).slice()};
  var site=sitesOn(c,d)[0]||(c.sites||[])[0]||'';
  var L0=lessonFor(c,site,d),it=L0?lessonItems(site,L0):defItems(c,site);
  if(!it.length){var pl=planFor(c,d);if(pl&&pl.online)it=lines(pl.online)}
  return {classId:c.id,date:d,site:site,lesson:L0||undefined,items:it,x:{},none:[]};
}
function onPut(r){r.savedAt=new Date().toISOString();var id=onId({id:r.classId},r.date);S.online.set(id,r);write('online/'+id,r,'o'+id);renderOv()}
function onWeekMsg(c,mon,s){
  var days=classDays(c,mon).filter(function(d){return S.online.has(onId(c,d))});
  var L=['📝 '+weekLabel(mon)+' 온라인학습 안내','','📌 '+(s.ename||s.name)];
  var site='',blocks=[],allOk=true,any=false;
  days.forEach(function(d){
    var r=S.online.get(onId(c,d)),dr=S.recs.get(recId(c,d));site=site||r.site;
    if(dr&&dr.att&&dr.att[s.id]==='absent'){blocks.push('['+mdw(d)+'] 결석');return}
    var x=(r.x&&r.x[s.id])||[];any=true;
    if((r.none||[]).indexOf(s.id)>=0){allOk=false;blocks.push('['+mdw(d)+'] ❌ 온라인학습 안 함');return}
    if(!x.length){blocks.push('['+mdw(d)+'] ✅ 전체 완료');return}
    allOk=false;
    var dn=r.items.filter(function(t,i){return x.indexOf(i)<0}),mi=r.items.filter(function(t,i){return x.indexOf(i)>=0});
    blocks.push('['+mdw(d)+'] 📄 일부 미완료'+(dn.length?'\n✅ '+dn.join(' / '):'')+'\n📄 '+mi.join(' / '));
  });
  if(site)L.push('📚 '+site);
  L.push('');
  if(!blocks.length)L.push('(이번 주에 저장된 온라인 수업일이 없어요)');
  else L.push(blocks.join('\n\n'));
  if(any){L.push('');L.push(allOk?'➕ 이번 주 온라인학습을 모두 잘 마무리했습니다. 수고했어요!':'➕ 미완료 활동은 다음 수업 전까지 마무리해 주세요.')}
  return L.join('\n');
}

function vTotal(sc){return (sc||[]).reduce(function(a,b){return a+(Number(b)||0)},0)}
function vDesc(i,lv){var d=(S.cfg.vdesc||[])[i]||[];return (d[lv-1]||'').trim()}
function vLines(i,lv){var l=((S.cfg.vlines||{})[i+'|'+lv]||[]).map(function(x){return String(x).trim()}).filter(Boolean);return l.length?l:(VLINES0[i+'|'+lv]||[])}
function vTipsOf(i){var l=((S.cfg.vtips||[])[i]||[]).map(function(x){return String(x).trim()}).filter(Boolean);return l.length?l:(VTIPS0[i]||[])}
function vFrame(k){var l=(((S.cfg.vframe||{})[k])||[]).map(function(x){return String(x).trim()}).filter(Boolean);return l.length?l:VFRAME0[k]}
var vNameCnt=0;
function vPick(arr,used,fill,body){
  var raw=arr.slice();
  if(body&&vNameCnt>=2){var nl=raw.filter(function(x){return x.indexOf('{name}')<0});if(nl.length)raw=nl}
  var c=raw.map(function(x){return {t:fill(x),n:x.indexOf('{name}')>=0}}),fresh=c.filter(function(x){return !used.some(function(u){return u.indexOf(x.t)>=0})});
  var pool=fresh.length?fresh:c,pk=pool[Math.floor(Math.random()*pool.length)];
  if(!pk)return '';if(pk.n)vNameCnt++;return pk.t;
}
function vAuto(sc,s,a){
  var cr=S.cfg.crit,mxs=S.cfg.vmax||4,mx=cr.length*mxs,tot=vTotal(sc),ra=mx?tot/mx:0,nm=(s&&(s.ename||s.name))||'your child';
  var title=(a&&a.title)||'speaking';
  var used=[];if(s)S.video.forEach(function(v){if(v.sid===s.id&&(!a||v.aid!==a.id)&&v.comment)used.push(v.comment)});
  var fill=function(t){return t.replace(/\{name\}/g,nm).replace(/\{title\}/g,title)};
  var lvl=function(i){return Math.max(1,Math.min(4,Math.round((sc[i]||0)/mxs*4)))};
  var idx=sc.map(function(v,i){return i}).filter(function(i){return sc[i]>0});
  if(!idx.length)return '';
  idx.sort(function(x,y){return sc[y]-sc[x]});
  var best=idx[0],weak=idx[idx.length-1],L=[];
  vNameCnt=0;
  L.push(vPick(vFrame(ra>=.9?'hi':ra>=.7?'mid':'lo'),used,fill));
  L.push(vPick(vLines(best,lvl(best)),used,fill,1));
  var second=idx.filter(function(i){return i!==best&&i!==weak&&lvl(i)>=3})[0];
  if(second!=null)L.push(vPick(vLines(second,lvl(second)),used,fill,1));
  if(sc[weak]<sc[best]){
    if(lvl(weak)<=2)L.push(vPick(vLines(weak,lvl(weak)),used,fill,1));
    L.push(vPick(vFrame('lead'),used,fill).replace(/\s+$/,'')+' '+vPick(vTipsOf(weak),used,fill)+'.');
  }
  L.push(vPick(vFrame('close'),used,fill));
  return L.join(' ');
}
function vSign(t){t=(t||'').trim();if(!t)return '';return /^teacher\b/i.test(t)?t:'Teacher '+t}
function vMsg(a,s,f){
  var cr=S.cfg.crit,mx=S.cfg.vmax||4,L=['🎬 '+(a?a.title:'')+' Speaking Feedback','','📌 '+(s.ename||s.name),'','[Evaluation]'];
  cr.forEach(function(n,i){var v=f.scores[i]||0;L.push('• '+n+' '+v+'/'+mx);var d=v?vDesc(i,v):'';if(d)L.push('   '+d)});
  L.push('','Total '+vTotal(f.scores)+'/'+(cr.length*mx));
  if(f.words&&f.words.trim()){L.push('','[Words to Review]',f.words.trim())}
  if(f.comment&&f.comment.trim()){L.push('','[Teacher\'s Comment]',f.comment.trim())}
  if(f.teacher&&f.teacher.trim())L.push('','- '+vSign(f.teacher));
  return L.join('\n');
}

function trange(c){return S.mr.all?['0000-01-01','9999-12-31']:monthRange(S.mr.month,c)}
function allTests(kind){
  var out=[];
  S.classes.slice().sort(function(x,y){return x.name.localeCompare(y.name,'ko')}).forEach(function(c){
    var rg=trange(c);
    var recs=Array.from(S.tests.values()).filter(function(t){return t.kind===kind&&t.classId===c.id&&t.date>=rg[0]&&t.date<=rg[1]}).sort(function(x,y){return x.date<y.date?-1:1});
    var by={},order=[''].concat(wtTypes().map(function(x){return x.id}));
    recs.forEach(function(t){var w=t.wt||'';(by[w]=by[w]||[]).push(t);if(order.indexOf(w)<0)order.push(w)});
    order.forEach(function(w){if(by[w])out.push({c:c,recs:by[w],stu:roster(c),wt:w})});
  });
  return out;
}
function allTestsHTML(kind){
  var G=allTests(kind),lab=kind==='king'?'Voca King':'단어시험';
  if(!G.length)return '<div class="empty" style="padding:18px 4px"><h2>기록이 없어요</h2><p>'+(S.mr.all?'아직':'이 달')+' '+lab+' 기록이 있는 반이 없어요.</p></div>';
  var nrec=0,np=0,sumAll=0,mxAll=0,kings=0;
  var tabs=G.map(function(g){
    var c=g.c;nrec+=g.recs.length;
    var head='<tr><th>학생</th>'+g.recs.map(function(t){return '<th class="c" title="'+esc(t.range||'')+'">'+md(t.date)+(Number(t.max)?'<br><small>/'+t.max+'</small>':'<br><input class="tmx" type="number" min="1" inputmode="numeric" placeholder="만점" aria-label="'+md(t.date)+' 만점" data-tmax="'+esc(t.classId+'|'+t.date+'|'+wtKey(t))+'">')+'</th>'}).join('')+'<th>평균</th>'+(kind==='king'?'<th>🏆</th>':'')+'</tr>';
    var body=g.stu.map(function(s){
      var sm=0,mx=0,pf=0,cnt=0;
      var cells=g.recs.map(function(t){
        var v=t.scores[s.id],m=Number(t.max)||0;
        if(v===undefined)return '<td class="c off">–</td>';
        if(v===-1)return '<td class="c off">결</td>';
        if(m>0){sm+=v;mx+=m}cnt++;var perf=m>0&&v===m;if(perf)pf++;
        var rv=t.re&&t.re[s.id];
        return '<td class="c'+(perf?' ok':'')+(kind==='word'&&needRe(v,m)?' lowsc':'')+'">'+v+(perf?'🏆':'')+(typeof rv==='number'?'<span class="reb2">↻ '+rv+'</span>':'')+'</td>';
      }).join('');
      np+=cnt;sumAll+=sm;mxAll+=mx;kings+=pf;
      return '<tr><th scope="row"><button type="button" class="dh" data-ms="'+esc(s.id)+'">'+esc(s.name)+'</button></th>'+cells+'<td class="tot">'+(mx?Math.round(sm/mx*100)+'%':'–')+'</td>'+(kind==='king'?'<td class="c">'+(pf||'')+'</td>':'')+'</tr>';

function mrCell(view,c,s,d){
  if(view==='word'){var W=wordTests(c,d),P=[],all=true,ab=false;W.forEach(function(t){var v=t.scores[s.id];if(v===undefined)return;if(v===-1){ab=true;return}var mx=Number(t.max)||0;if(!(mx&&v===mx))all=false;P.push(v+(mx?'/'+mx:'')+(mx&&v===mx?'🏆':'')+(t.re&&typeof t.re[s.id]==='number'?' ↻'+t.re[s.id]:''))});if(!P.length)return ab?['결','off']:['–','off'];return [P.join(' · '),all?'ok':'']}
  if(view==='coach'){var k=getCoach(c,d);if(!k)return ['–','off'];if((k.skip||[]).indexOf(s.id)>=0)return ['–','off'];var n=(k.items||[]).length,x=(k.x&&k.x[s.id])||[];return [(n-x.length)+'/'+n,x.length?'bad':'']}

  var a=r.att[s.id]||'present',nt=r.note&&r.note[s.id]||{};
  if(view==='att')return [{present:'○',late:'△',absent:'×'}[a],{present:'',late:'warn',absent:'bad'}[a],!!nt.a];
  if(a==='absent')return ['–','off'];
  if(view==='book')return r.book[s.id]==='no'?['×','bad']:['○',''];

function mrTotal(view,c,s,dates){
  var n=0,a=0,b=0,x=0,sum=0,mxs=0;
  dates.forEach(function(d){
    if(view==='att'){var r=S.recs.get(recId(c,d));if(!r)return;n++;var v=r.att[s.id]||'present';if(v==='absent')a++;else if(v==='late'){b++}}
    else if(view==='book'){var r2=S.recs.get(recId(c,d));if(!r2||(r2.att[s.id]==='absent'))return;n++;if(r2.book[s.id]==='no')a++}
    else if(view==='hw'){var r3=S.recs.get(recId(c,d));if(!r3||(r3.att[s.id]==='absent'))return;n++;var w=r3.hw[s.id]||'done';if(w==='done')a++;else if(w==='partial')b++;else x++}
    else if(view==='word'){wordTests(c,d).forEach(function(t){var v2=t.scores[s.id];if(typeof v2==='number'&&v2>=0&&Number(t.max)>0){n++;sum+=v2;mxs+=Number(t.max)}})}
    else{var k=getCoach(c,d);if(!k||(k.skip||[]).indexOf(s.id)>=0)return;var it=(k.items||[]).length;n+=it;a+=it-((k.x&&k.x[s.id])||[]).length}
  });
  if(!n)return '–';
  if(view==='att')return '출석 '+(n-a)+'/'+n+(b?' · 지각 '+b:'')+(a?' · 결석 '+a:'');
  if(view==='book')return a?'미지참 '+a:'모두 지참';
  if(view==='hw')return '완료 '+a+'/'+n+(b?' · 미흡 '+b:'')+(x?' · 안함 '+x:'');
  if(view==='word')return mxs?Math.round(sum/mxs*100)+'%':'–';
  return pct(a,n)+'%';
}

function stuData(s,a,b){
  var c=S.classes.find(function(x){return x.id===s.classId});if(!c)return null;
  var D={c:c,n:0,present:0,late:0,absent:0,reasons:[],nobook:0,hwn:0,hwd:0,hwp:0,hwx:0,hwnotes:[],bknotes:[],cn:0,cd:0,tests:[],kings:[],onl:[],vid:[]};
  S.recs.forEach(function(r){
    if(r.classId!==c.id||r.date<a||r.date>b)return;
    D.n++;var v=r.att[s.id]||'present',nt=r.note&&r.note[s.id]||{};
    if(v==='absent'){D.absent++;D.reasons.push(md(r.date)+' 결석'+(nt.a?'('+nt.a+')':''));return}
    if(v==='late'){D.late++;D.reasons.push(md(r.date)+' 지각'+(nt.a?'('+nt.a+')':''))}else D.present++;
    if(r.book[s.id]==='no'){D.nobook++;if(r.bkb&&r.bkb[s.id]&&r.bkb[s.id].length)D.bknotes.push(md(r.date)+' ('+r.bkb[s.id].join(', ')+')')}
    var w=r.hw[s.id]||'done';D.hwn++;
    if(w==='done')D.hwd++;else{if(w==='partial')D.hwp++;else D.hwx++;D.hwnotes.push(md(r.date)+' '+(w==='partial'?'미흡':'안 함')+((w==='partial'&&r.hwb&&r.hwb[s.id]&&r.hwb[s.id].length)?' ('+r.hwb[s.id].join(', ')+')':'')+(nt.h?': '+nt.h:''))}
  });
  S.coach.forEach(function(k){if(k.classId!==c.id||k.date<a||k.date>b||(k.skip||[]).indexOf(s.id)>=0||!s.coaching)return;var n=(k.items||[]).length;D.cn+=n;D.cd+=n-((k.x&&k.x[s.id])||[]).length});
  S.tests.forEach(function(t){
    if(t.classId!==c.id||t.date<a||t.date>b)return;var v=t.scores[s.id];if(typeof v!=='number'||v<0)return;
    var o={d:t.date,v:v,mx:Number(t.max)||0,range:t.range,wn:t.wt?wtName(t.wt):'',re:t.re&&typeof t.re[s.id]==='number'?t.re[s.id]:null};(t.kind==='king'?D.kings:D.tests).push(o);
  });
  D.tests.sort(function(x,y){return x.d<y.d?-1:1});D.kings.sort(function(x,y){return x.d<y.d?-1:1});
  S.online.forEach(function(r){
    if(r.classId!==c.id||r.date<a||r.date>b)return;var dr=S.recs.get(recId(c,r.date));if(dr&&dr.att[s.id]==='absent')return;
    D.onl.push({d:r.date,miss:(r.none||[]).indexOf(s.id)>=0?['학습 안 함']:((r.x&&r.x[s.id])||[]).map(function(i){return r.items[i]})});
  });
  D.onl.sort(function(x,y){return x.d<y.d?-1:1});
  S.video.forEach(function(v){if(v.sid!==s.id||v.date<a||v.date>b)return;var as=S.vassign.get(v.aid);D.vid.push({d:v.date,title:as?as.title:'',tot:v.total,max:S.cfg.crit.length*(S.cfg.vmax||4)})});
  D.vid.sort(function(x,y){return x.d<y.d?-1:1});
  return D;

function autoRubrics(c,ym){
  var rg=monthRange(ym,c),B={};
  S.plans.forEach(function(pl){if(!pl||pl.classId!==c.id||pl.date<rg[0]||pl.date>rg[1])return;(pl.blocks||[]).forEach(function(b){var k=nk(b.book);if(k)B[k]=1})});

function rbParse(wb){
  var res=[],isKo=false;
  wb.SheetNames.forEach(function(sn){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''}).map(function(r){return r.map(function(c){return String(c).replace(/\s+/g,' ').trim()})}),cur=null;
    var cat=/writing/i.test(sn)?'writing':/grammar/i.test(sn)?'grammar':'reading';
    rows.forEach(function(r){
      var m=(r[0]||'').match(/^(\d+)\.\s*(.+?)\s*-?\s*(평가 루브릭|Assessment Rubric)\s*$/i);
      if(m){cur={name:m[2].replace(/\s*-\s*$/,'').trim(),cat:cat,areas:[]};res.push(cur);if(/평가 루브릭/.test(m[3]))isKo=true;return}
      if(!cur||!r[0]||/^(영역|Area)$/i.test(r[0])||!r[2]||/노란 칸|yellow/i.test(r[0]))return;
      cur.areas.push({name:r[0],basis:r[1],s:[r[5],r[4],r[3],r[2]]});
    });
  });
  return {ko:isKo,list:res};
}

function tableRows(c){
  var rg=monthRange(S.mr.month,c),stu=roster(c),ds={};
  S.recs.forEach(function(r){if(r.classId===c.id&&r.date>=rg[0]&&r.date<=rg[1])ds[r.date]=1});
  S.tests.forEach(function(r){if(r.classId===c.id&&r.date>=rg[0]&&r.date<=rg[1])ds[r.date]=1});
  var A=[],B=[];
  Object.keys(ds).sort().forEach(function(d){
    stu.forEach(function(s){
      var r=S.recs.get(recId(c,d)),WL=wordTests(c,d),w=WL.length?WL:null,k=tGet(c,d,'king'),co=getCoach(c,d);
      var a=r?(r.att[s.id]||'present'):'',nt=r&&r.note&&r.note[s.id]||{};
      var sc=function(t){if(!t)return '';if(Array.isArray(t))return t.map(function(x){var v=sc(x);return v===''?'':(x.wt?wtName(x.wt)+' ':'')+v+(x.re&&typeof x.re[s.id]==='number'?' (재 '+x.re[s.id]+')':'')}).filter(Boolean).join(' / ');var v=t.scores[s.id];return v===undefined?'':v===-1?'결시':v};
      var cc='';if(co&&s.coaching&&(co.skip||[]).indexOf(s.id)<0){var n=(co.items||[]).length;cc=(n-((co.x&&co.x[s.id])||[]).length)+'/'+n}
      if(!r&&!w&&!k&&!co)return;
      A.push([d,s.name,s.ename||'',a?{present:'출석',late:'지각',absent:'결석'}[a]:'',nt.a||'',r&&a!=='absent'?(r.book[s.id]==='no'?'미지참':'지참'):'',r&&a!=='absent'?{done:'완료',partial:'미흡',none:'안 함'}[r.hw[s.id]||'done']:'',nt.h||'',sc(w),w?w.map(function(x){return x.max||''}).join(' / '):'',sc(k),cc]);
    });
  });
  stu.forEach(function(s){
    var D=stuData(s,rg[0],rg[1]);if(!D)return;var sm=0,mm=0;D.tests.forEach(function(t){if(t.mx>0){sm+=t.v;mm+=t.mx}});

  });
  return [B,A];
}

  var t=etype(X.cfg.tid);

function xiFind(X,row){

  var pool=S.students.filter(function(s){return s.status!=='left'&&norm(s.name)===nm});
  if(cv)pool=pool.filter(function(s){var n=norm(clsName(s.classId));return n&&(n===cv||n.indexOf(cv)>=0||cv.indexOf(n)>=0)});
  else if(X.kind!=='exam'&&X.cfg.cid)pool=pool.filter(function(s){return s.classId===X.cfg.cid});
  if(pool.length>1&&en)pool=pool.filter(function(s){return norm(s.ename)===en});
  if(pool.length===1)return {s:pool[0]};
  return {bad:pool.length?'amb':'miss',name:cellStr(row[X.map.name])};
